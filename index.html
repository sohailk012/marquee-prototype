<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marquee · Oakmere Dental</title>
<meta name="description" content="Marquee prototype: an AI marketing team for a small business, with lead gen, social and paid ads desks. Mock data only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"><i class="a1"></i><i class="a2"></i><i class="a3"></i><i class="a4"></i></div>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#home" aria-label="Marquee home">
        <span class="brand-name">Marquee</span>
        <span class="bulbs" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
      </a>
      <span class="client glass-chip">Oakmere Dental</span>
      <button class="bell glass-chip" type="button" data-action="open-notes" aria-label="Updates"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span class="badge" id="bell-count" hidden></span></button>
      <button class="am glass-chip" type="button" data-action="open-sam" aria-label="Sam, your account manager">
        <span class="avatar avatar-soft">S</span><span class="am-text"><b>Sam</b><small>Account manager</small></span>
      </button>
    </div>
  </header>

  <nav class="dock" aria-label="Main">
    <span class="dock-lens" id="dock-lens" aria-hidden="true"></span>
    <a href="#home" data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Today</span></a>
    <a href="#plan" data-nav="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg><span>Plan</span></a>
    <button class="dock-ask" type="button" data-action="open-chat" aria-label="Ask your team"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.5c.4 3.2 1.9 5 5 5.5-3.1.5-4.6 2.3-5 5.5-.4-3.2-1.9-5-5-5.5 3.1-.5 4.6-2.3 5-5.5z"/></svg><span>Ask</span></button>
    <a href="#desks" data-nav="desks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg><span>Results</span></a>
    <a href="#team" data-nav="team"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2a5 5 0 0 1 5.5 4.8"/></svg><span>Team</span></a>
  </nav>

  <main id="view" tabindex="-1"></main>

  <footer class="foot">
    Prototype with made-up data. Oakmere Dental is a fictional practice. Compliance checks are checks, not legal advice.
  </footer>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
    <button class="drawer-close" type="button" data-action="close-drawer" aria-label="Close">×</button>
    <div id="drawer-body"></div>
  </aside>
  <div class="alert" id="alert" role="alertdialog" aria-live="assertive" aria-labelledby="alert-title" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
